[workspace]
resolver = "3"
members = [
  "crates/pixmap",
  "crates/pixmap-core",
  "crates/pixmap-derive",
  "crates/point",
  "crates/precursor",
  "crates/precursor-config",
  "crates/precursor-cursor",
  "crates/precursor-error",
  "crates/precursor-filesys",
  "crates/precursor-formats",
  "crates/precursor-paths",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
log = "0.4.34"
pixmap.path = "crates/pixmap"
pixmap-core.path = "crates/pixmap-core"
pixmap-derive.path = "crates/pixmap-derive"
point.path = "crates/point"
precursor-config.path = "crates/precursor-config"
precursor-cursor.path = "crates/precursor-cursor"
precursor-error.path = "crates/precursor-error"
precursor-filesys.path = "crates/precursor-filesys"
precursor-formats.path = "crates/precursor-formats"
precursor-paths.path = "crates/precursor-paths"
thiserror = "2.0.20"
toml = "1.1.4"

[workspace.dependencies.clap]
version = "4.6.5"
features = ["derive"]

[workspace.dependencies.serde]
version = "1.0.229"
features = ["derive"]
