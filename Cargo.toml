[workspace]
resolver = "3"
members = [
  "crates/config",
  "crates/formats",
  "crates/pixmap",
  "crates/pixmap-core",
  "crates/pixmap-derive",
  "crates/pixmap-png",
  "crates/point",
  "crates/precursor",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
precursor-config.path = "crates/config"
precursor-formats.path = "crates/formats"
precursor-pixmap.path = "crates/pixmap"
precursor-pixmap-core.path = "crates/pixmap-core"
precursor-pixmap-derive.path = "crates/pixmap-derive/"
precursor-pixmap-png.path = "crates/pixmap-png"
precursor-point.path = "crates/point"

thiserror = "2.0.20"
toml = "1.1.4"

[workspace.dependencies.clap]
version = "4.6.5"
features = ["derive"]

[workspace.dependencies.serde]
version = "1.0.229"
features = ["derive"]
