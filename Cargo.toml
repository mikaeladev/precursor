[workspace]
resolver = "3"
members = [
  "crates/config",
  "crates/formats",
  "crates/pixmap",
  "crates/point",
  "crates/precursor",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
crate_config.path = "crates/config"
crate_formats.path = "crates/formats"
crate_pixmap.path = "crates/pixmap"
crate_point.path = "crates/point"

thiserror = "2.0.20"
toml = "1.1.4"

[workspace.dependencies.clap]
version = "4.6.5"
features = ["derive"]

[workspace.dependencies.serde]
version = "1.0.229"
features = ["derive"]
